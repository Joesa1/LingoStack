<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>译伴视频预处理</title><style>body{font:16px system-ui;max-width:900px;margin:32px auto;padding:0 16px;background:#f6f8fa;color:#17212b}main{background:white;padding:24px;border-radius:16px}input,textarea,select,button{font:inherit;padding:10px;border:1px solid #ccd5dd;border-radius:8px}input,textarea,select{width:100%;box-sizing:border-box;margin:6px 0 14px}textarea{min-height:180px}button{cursor:pointer;background:#087ea4;color:white;border:0;margin-right:8px}.muted{color:#667}</style><main><h1>译伴 · 视频预处理</h1><p class=muted>把字幕整理成连续中文文本。当前为本地 MVP，凭证只保存在本机。</p><label>视频标题<input id=title placeholder="BBC / YouTube 访谈"></label><label>视频 URL<input id=url placeholder="https://www.youtube.com/watch?v=..."></label><label>原始字幕（每行一句）<textarea id=source placeholder="Paste English subtitles here..."></textarea></label><label>翻译 API Key<input id=key type=password></label><label>兼容 API 地址<input id=base value="https://api.openai.com/v1"></label><label>模型<input id=model value="gpt-4o-mini"></label><button id=run>翻译并保存</button><button id=clear>清空</button><p id=status></p><section id=out></section><h2>已保存视频</h2><div id=list></div></main><script>const $=id=>document.getElementById(id),store=JSON.parse(localStorage.lingoJobs||'[]');function render(){ $('list').innerHTML=store.map((x,i)=>`<article><b>${x.title||x.url||'未命名'}</b><p>${x.translation?.slice(0,160)||'未处理'}</p></article>`).join('')||'<p class=muted>暂无任务</p>'}function save(){localStorage.lingoJobs=JSON.stringify(store);render()}$('run').onclick=async()=>{const text=$('source').value.trim();if(!text)return $('status').textContent='请先粘贴字幕。';const job={title:$('title').value,url:$('url').value,source:text,createdAt:Date.now()};if(!$('key').value){job.translation='[未翻译] '+text;$('status').textContent='已保存原文。填写 API Key 后可翻译。'}else{ $('run').disabled=true;$('status').textContent='翻译中…';try{const r=await fetch($('base').value.replace(/\/$/,'')+'/chat/completions',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+$('key').value},body:JSON.stringify({model:$('model').value,messages:[{role:'system',content:'Translate the supplied subtitles into natural Chinese. Preserve paragraph breaks. Do not add commentary.'},{role:'user',content:text}]})});if(!r.ok)throw Error('HTTP '+r.status);job.translation=(await r.json()).choices?.[0]?.message?.content||'';$('status').textContent='翻译完成，已保存。'}catch(e){$('status').textContent='翻译失败：'+e.message;return}finally{$('run').disabled=false}}store.unshift(job);save();$('out').innerHTML='<h2>中文文本</h2><textarea readonly>'+job.translation+'</textarea>'};$('clear').onclick=()=>{['title','url','source'].forEach(id=>$(id).value='');$('out').innerHTML='';$('status').textContent=''};render()</script>
