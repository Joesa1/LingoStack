<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="lingo-token" content="__TOKEN__"><title>译伴 · 视频预处理 0.2.1</title><link rel="stylesheet" href="style.css"></head>
<body><main><header><span>译伴 · 本地视频工作台 / 0.2.1</span><h1>给一个链接，读懂整段访谈。</h1><p>自动获取 YouTube 人工或自动字幕，分段翻译成连贯中文，保存在你的电脑上。</p></header>
<section><h2>1. 连接翻译服务</h2><div class="grid"><label>翻译服务商<select id="provider"></select></label><label>API Key<input id="key" type="password" autocomplete="off" placeholder="填写所选服务商的 API Key"></label></div><p class="hint">Key 只在本次运行内用于请求，不写入任务记录或磁盘。关闭后需重新填写。</p><div class="grid"><label>模型 ID<input id="model" placeholder="先获取模型列表，或手动填写"></label><label>可用模型<select id="models"><option value="">点击获取模型列表</option></select></label></div>
<details><summary>接口地址与协议</summary><label>API 地址<input id="base" type="url"></label><label>接口协议<select id="protocol"><option value="openai-compatible">兼容 Chat Completions</option><option value="openai-responses">Responses</option><option value="anthropic">Anthropic Messages</option><option value="gemini">Gemini</option></select></label></details><div class="actions"><button id="modelsButton">获取模型列表</button><button id="test">测试连接</button></div><p id="configStatus" role="status" aria-live="polite"></p></section>
<section><h2>2. 添加视频</h2><label>YouTube 视频链接<input id="url" type="url" placeholder="https://www.youtube.com/watch?v=…"></label><p class="hint">支持公开、可访问且有字幕的普通视频。目标语言：简体中文。无需填写标题或粘贴字幕。</p><button id="start" class="primary">获取字幕并翻译</button><p id="status" role="status" aria-live="polite"></p></section>
<section><h2>我的视频 <small id="count"></small></h2><p class="hint">获取字幕后分段翻译；失败可重试，已完成分段会保留。处理中请保留启动终端，网页可以关闭。</p><div id="jobs"></div></section><footer>本版交付自动获取字幕、中文全文和 TXT 下载。无字幕音频转录、BBC 和 MP3 合成尚未包含。</footer></main><script src="app.js"></script></body></html>
